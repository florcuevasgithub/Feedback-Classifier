# feedback-classifier/docker-compose.yml
services:  # ← Empezar directamente aquí
  api:
    build:
      context: .
      dockerfile: Dockerfile.backblaze
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./feedback.db
    volumes:
      - model_cache:/app/model_files  # ← CACHE PERSISTENTE

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/api/feedback/submit
    depends_on:
      - api

volumes:
  model_cache:  # ← MODELOS SE GUARDAN AQUÍ